<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Explorer (Swagger) — Swiss Law Collection</title>
    <link rel="stylesheet" href="assets/swagger-ui.css">
    <style>
        :root { --red: #D52B1E; --dark: #1a1a1a; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        header { background: var(--red); color: white; padding: 1.2rem 2rem; text-align: center; }
        header h1 { font-size: 1.4rem; margin: 0; }
        nav { background: var(--dark); padding: 0.5rem 2rem; text-align: center; }
        nav a { color: #ccc; text-decoration: none; margin: 0 1rem; font-size: 0.9rem; }
        nav a:hover { color: white; }
        .swagger-ui .topbar { display: none; }
    </style>
</head>
<body>
    <header><h1>Swiss Law Collection — API Explorer</h1></header>
    <nav>
        <a href="index.html">Search</a>
        <a href="laws.html">Law Index</a>
        <a href="stats.html">Statistics</a>
        <a href="api.html">API Docs</a>
        <a href="swagger.html"><strong>Swagger</strong></a>
    </nav>
    <div id="swagger-ui"></div>
    <script src="assets/swagger-ui-bundle.js"></script>
    <script>
    window.ui = SwaggerUIBundle({
        url: 'openapi.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        tryItOutEnabled: true,
        defaultModelsExpandDepth: -1,
        presets: [SwaggerUIBundle.presets.apis],
    });
    </script>
</body>
</html>
