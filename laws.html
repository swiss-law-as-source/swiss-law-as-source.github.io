<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law Index — Swiss Law Collection</title>
    <style>
        :root {
            --red: #D52B1E;
            --dark: #1a1a1a;
            --gray: #f5f5f5;
            --border: #e0e0e0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--dark);
            line-height: 1.6;
            background: #fff;
        }
        header { background: var(--red); color: white; padding: 2rem; text-align: center; }
        header h1 { font-size: 1.8rem; margin-bottom: 0.3rem; }
        header p { opacity: 0.9; font-size: 1rem; }
        nav { background: var(--dark); padding: 0.5rem 2rem; text-align: center; }
        nav a { color: #ccc; text-decoration: none; margin: 0 1rem; font-size: 0.9rem; }
        nav a:hover { color: white; }
        main { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem; margin-bottom: 1.5rem;
        }
        .kpi-card {
            background: var(--gray); border-radius: 8px; padding: 1.2rem;
            text-align: center; border: 1px solid var(--border);
        }
        .kpi-card .value { font-size: 1.6rem; font-weight: 700; color: var(--red); }
        .kpi-card .label { font-size: 0.8rem; color: #666; margin-top: 0.2rem; }
        .controls { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
        .controls select, .controls input {
            padding: 0.45rem 0.7rem; border: 1px solid var(--border); border-radius: 6px;
            font-size: 0.9rem; background: white;
        }
        .controls input { flex: 1; min-width: 200px; }
        .table-wrap { overflow-x: auto; }
        .data-table { border-collapse: collapse; width: 100%; font-size: 0.84rem; }
        .data-table th, .data-table td { border: 1px solid var(--border); padding: 0.35rem 0.6rem; text-align: left; vertical-align: top; }
        .data-table th { background: var(--gray); cursor: pointer; user-select: none; white-space: nowrap; position: sticky; top: 0; }
        .data-table th .arrow { color: var(--red); }
        .data-table td.num { text-align: right; white-space: nowrap; }
        .data-table tbody tr:nth-child(even) { background: #fafafa; }
        .data-table a { color: var(--red); text-decoration: none; }
        .lang-badge {
            display: inline-block; background: var(--gray); border: 1px solid var(--border);
            border-radius: 4px; padding: 0 0.35rem; margin-right: 0.25rem; font-size: 0.75rem;
        }
        .note { font-size: 0.8rem; color: #666; margin: 0.75rem 0 2rem; }
        .load-more { margin: 1rem auto; display: block; padding: 0.5rem 1.5rem;
            background: var(--gray); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
        footer { text-align: center; padding: 2rem; color: #666; font-size: 0.85rem; border-top: 1px solid var(--border); margin-top: 3rem; }
        footer a { color: var(--red); text-decoration: none; }
    </style>
</head>
<body>
    <header>
        <h1>Law Index</h1>
        <p>Per-entity index — languages, text volume &amp; article counts per law</p>
    </header>
    <nav>
        <a href="index.html">Dashboard</a>
        <a href="laws.html"><strong>Laws</strong></a>
        <a href="api.html">API</a>
    </nav>
    <main>
        <div class="kpi-grid" id="entity-kpis"></div>
        <div class="controls">
            <select id="entity"></select>
            <input id="filter" type="search" placeholder="Filter by number or title…">
        </div>
        <div class="table-wrap">
            <table class="data-table">
                <thead>
                    <tr>
                        <th data-key="id">Number <span class="arrow"></span></th>
                        <th data-key="title">Title <span class="arrow"></span></th>
                        <th data-key="langs">Languages <span class="arrow"></span></th>
                        <th data-key="chars">Characters <span class="arrow"></span></th>
                        <th data-key="articles">Articles <span class="arrow"></span></th>
                    </tr>
                </thead>
                <tbody id="laws-body"></tbody>
            </table>
        </div>
        <button class="load-more" id="load-more" hidden>Show more</button>
        <p class="note" id="article-note"></p>
    </main>
    <footer>
        <a href="https://github.com/benjamin-arfa/swiss-law">GitHub Repository</a> &middot;
        Data: <a href="https://www.fedlex.admin.ch">Fedlex</a> + <a href="https://www.lexfind.ch">LexFind</a>
    </footer>

    <script>
    (async function() {
        const idx = await (await fetch('api/v1/laws/index.json', { cache: 'no-cache' })).json();
        const cache = {};
        const PAGE = 500;
        let current = null, sortKey = 'id', sortDir = 1, shown = PAGE;

        document.getElementById('article-note').textContent =
            'Characters = markdown body length per language version. Articles: ' + idx.article_count_note;

        const sel = document.getElementById('entity');
        const codes = Object.keys(idx.entities).sort((a, b) =>
            (a !== 'CH') - (b !== 'CH') || a.localeCompare(b));
        sel.innerHTML = `<option value="ALL">ALL — search across all entities (${idx.total_laws.toLocaleString()})</option>` +
            codes.map(c =>
            `<option value="${c}">${c} — ${idx.entities[c].name} (${idx.entities[c].laws.toLocaleString()})</option>`
        ).join('');

        async function loadAll() {
            // Cross-entity search backed by the flat search index (laws.json).
            const laws = await (await fetch('laws.json', { cache: 'no-cache' })).json();
            const enc = p => p.split('/').map(encodeURIComponent).join('/');
            const sums = Object.values(idx.entities).reduce(
                (a, e) => ({ c: a.c + e.total_chars, n: a.n + e.total_articles }), { c: 0, n: 0 });
            return {
                laws: laws.length,
                total_chars: sums.c, total_articles: sums.n,
                link_base: idx.link_base,
                items: laws.map(l => ({
                    id: (l.canton ? l.canton.toUpperCase() + ' ' : 'CH ') + l.sr,
                    title: l.title,
                    link: idx.link_base + enc(l.path),
                    languages: Object.fromEntries((l.languages || []).map(x => [x, { chars: 0, articles: 0, path: l.path }])),
                })),
            };
        }

        function metric(item, key) {
            const langs = Object.values(item.languages);
            if (key === 'chars') return langs.reduce((s, l) => s + l.chars, 0);
            if (key === 'articles') return langs.reduce((s, l) => s + l.articles, 0);
            if (key === 'langs') return Object.keys(item.languages).length;
            return item[key] || '';
        }

        function render() {
            if (!current) return;
            const q = document.getElementById('filter').value.trim().toLowerCase();
            let items = current.items;
            if (q) items = items.filter(i =>
                i.id.toLowerCase().includes(q) || (i.title || '').toLowerCase().includes(q));
            items = [...items].sort((a, b) => {
                const va = metric(a, sortKey), vb = metric(b, sortKey);
                return (typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb), undefined, {numeric: true})) * sortDir;
            });

            document.getElementById('entity-kpis').innerHTML = [
                { value: current.laws.toLocaleString(), label: 'Laws' },
                { value: current.total_chars.toLocaleString(), label: 'Characters (all languages)' },
                { value: current.total_articles.toLocaleString(), label: 'Articles (heuristic)' },
                { value: q ? items.length.toLocaleString() : '—', label: 'Matching filter' },
            ].map(k => `<div class="kpi-card"><div class="value">${k.value}</div><div class="label">${k.label}</div></div>`).join('');

            const rows = items.slice(0, shown).map(i => {
                const langCells = Object.entries(i.languages).map(([l, d]) =>
                    `<span class="lang-badge" title="${d.chars.toLocaleString()} chars, ${d.articles} art.">${l}</span>`).join('');
                const chars = Object.values(i.languages).reduce((s, l) => s + l.chars, 0);
                const arts = Object.values(i.languages).reduce((s, l) => s + l.articles, 0);
                return `<tr>
                    <td><a href="${i.link}" target="_blank" rel="noopener">${i.id}</a></td>
                    <td>${(i.title || '').replace(/</g, '&lt;')}</td>
                    <td>${langCells}</td>
                    <td class="num">${chars.toLocaleString()}</td>
                    <td class="num">${arts.toLocaleString()}</td>
                </tr>`;
            }).join('');
            document.getElementById('laws-body').innerHTML = rows ||
                '<tr><td colspan="5">No laws match.</td></tr>';
            document.getElementById('load-more').hidden = items.length <= shown;

            document.querySelectorAll('.data-table th').forEach(th => {
                th.querySelector('.arrow').textContent =
                    th.dataset.key === sortKey ? (sortDir > 0 ? '▲' : '▼') : '';
            });
        }

        async function load(code) {
            if (!cache[code]) {
                document.getElementById('laws-body').innerHTML = '<tr><td colspan="5">Loading…</td></tr>';
                cache[code] = await (await fetch(idx.entities[code].file)).json();
            }
            current = cache[code];
            shown = PAGE;
            render();
        }

        sel.addEventListener('change', e => load(e.target.value));
        document.getElementById('filter').addEventListener('input', () => { shown = PAGE; render(); });
        document.getElementById('load-more').addEventListener('click', () => { shown += PAGE; render(); });
        document.querySelectorAll('.data-table th').forEach(th =>
            th.addEventListener('click', () => {
                const k = th.dataset.key;
                if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = 1; }
                render();
            }));

        load('CH');
    })();
    </script>
</body>
</html>
